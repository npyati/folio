<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Folio Collection</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #fafafa;
      --bg-tertiary: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-primary: #000000;
      --border-secondary: #e0e0e0;
      --border-tertiary: #cccccc;
      --border-light: #f0f0f0;
      --accent-color: #0066cc;
      --danger-color: #cc0000;
      --btn-bg: #ffffff;
      --btn-text: #333333;
      --scrollbar-thumb: rgba(0, 0, 0, 0.15);
      --drag-over-bg: #f0f0ff;
      --overlay-bg: rgba(0, 0, 0, 0.8);
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #242424;
      --bg-tertiary: #2a2a2a;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-muted: #707070;
      --border-primary: #e8e8e8;
      --border-secondary: #3a3a3a;
      --border-tertiary: #4a4a4a;
      --border-light: #333333;
      --accent-color: #4da6ff;
      --danger-color: #ff6666;
      --btn-bg: #2a2a2a;
      --btn-text: #e0e0e0;
      --scrollbar-thumb: rgba(255, 255, 255, 0.2);
      --drag-over-bg: #2a2a3a;
      --overlay-bg: rgba(0, 0, 0, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: var(--bg-primary);
      padding: 24px 20px 20px;
      border-bottom: 3px solid var(--border-primary);
      flex-shrink: 0;
      position: relative;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      font-weight: 400;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      text-align: center;
    }

    .subtitle {
      margin: 0;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    #articles-list {
      margin: 0;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      background: var(--bg-secondary);
    }

    #articles-list::-webkit-scrollbar {
      width: 8px;
    }

    #articles-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #articles-list::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    .article-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: 0;
      padding: 16px;
      margin-bottom: 12px;
      cursor: move;
      transition: all 0.15s ease;
    }

    .article-item:hover {
      border-color: var(--border-primary);
      background: var(--bg-primary);
    }

    .article-title {
      font-weight: 500;
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--text-primary);
      line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: break-word;
      transition: color 0.15s ease;
    }

    .article-title:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .article-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .article-source {
      color: var(--text-primary);
      padding: 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-right: 1px solid var(--border-tertiary);
      padding-right: 10px;
    }

    .article-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    button {
      padding: 6px 14px;
      border: 1px solid var(--border-tertiary);
      border-radius: 0;
      background: var(--btn-bg);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
      color: var(--btn-text);
    }

    button:hover {
      background: var(--border-primary);
      color: var(--bg-primary);
      border-color: var(--border-primary);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button:disabled:hover {
      background: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--border-tertiary);
    }

    .btn-small {
      padding: 5px 12px;
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 8px;
      padding: 16px;
      background: var(--bg-primary);
      border-top: 2px solid var(--border-primary);
      flex-shrink: 0;
    }

    .btn-primary {
      flex: 1;
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: var(--border-primary);
      color: var(--bg-primary);
      border: 1px solid var(--border-primary);
    }

    .btn-primary:hover {
      opacity: 0.8;
    }

    .btn-danger {
      background: var(--btn-bg);
      border: 1px solid var(--border-tertiary);
      color: var(--danger-color);
    }

    .btn-danger:hover {
      background: var(--danger-color);
      color: var(--bg-primary);
      border-color: var(--danger-color);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .empty-state-hint {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .settings-toggle {
      position: absolute;
      top: 20px;
      right: 50px;
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      opacity: 0.6;
    }

    .settings-toggle:hover {
      opacity: 1;
      background: transparent;
      color: inherit;
    }

    .add-current-btn {
      position: absolute;
      top: 20px;
      right: 16px;
      background: var(--border-primary);
      color: var(--bg-primary);
      border: 1px solid var(--border-primary);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .add-current-btn:hover {
      opacity: 0.8;
    }

    .settings-panel {
      display: none;
      background: var(--bg-tertiary);
      border-top: 2px solid var(--border-primary);
      padding: 16px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 300px;
    }

    .settings-panel.active {
      display: block;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .settings-description {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .domain-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .domain-input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-tertiary);
      border-radius: 0;
      font-size: 12px;
      font-family: inherit;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .domain-input-group input:focus {
      outline: none;
      border-color: var(--border-primary);
    }

    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .domain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      padding: 10px 12px;
      font-size: 12px;
    }

    .domain-name {
      font-family: 'Courier New', monospace;
      color: var(--text-primary);
    }

    .domain-remove {
      padding: 4px 10px;
      font-size: 11px;
      background: transparent;
      border: 1px solid var(--border-tertiary);
      color: var(--danger-color);
    }

    .domain-remove:hover {
      background: var(--danger-color);
      color: var(--bg-primary);
      border-color: var(--danger-color);
    }

    .import-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .import-panel {
      background: var(--bg-primary);
      border: 2px solid var(--border-primary);
      padding: 24px;
      max-width: 400px;
      width: 90%;
    }

    .import-title {
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .import-progress-bar {
      width: 100%;
      height: 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-tertiary);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .import-progress-fill {
      height: 100%;
      background: var(--border-primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .import-status {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .import-details {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    #import-cancel {
      width: 100%;
    }

    #articles-list.drag-over {
      background: var(--drag-over-bg);
      border: 2px dashed var(--border-primary);
      position: relative;
    }

    #articles-list.drag-over::after {
      content: 'Drop .folio file to import';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      pointer-events: none;
      text-align: center;
      padding: 20px;
      background: var(--bg-primary);
      border: 2px solid var(--border-primary);
      z-index: 1000;
    }

    .theme-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-tertiary);
      color: var(--btn-text);
    }

    .theme-btn.active {
      background: var(--border-primary);
      color: var(--bg-primary);
      border-color: var(--border-primary);
    }

    .theme-btn:hover:not(.active) {
      border-color: var(--border-primary);
    }
  </style>
</head>
<body>
  <!-- Import progress overlay -->
  <div class="import-overlay" id="import-overlay" style="display: none;">
    <div class="import-panel">
      <h3 class="import-title">Importing Articles</h3>
      <div class="import-progress-bar">
        <div class="import-progress-fill" id="import-progress-fill"></div>
      </div>
      <div class="import-status" id="import-status">Starting import...</div>
      <div class="import-details" id="import-details"></div>
      <button id="import-cancel" class="btn-danger">Cancel</button>
    </div>
  </div>

  <!-- Hidden file input for .folio import -->
  <input type="file" id="folio-file-input" accept=".folio" style="display: none;">

  <div class="header">
    <h1>folio</h1>
    <div class="subtitle" id="article-count">No articles saved</div>
    <button class="settings-toggle" id="settings-toggle">⚙️</button>
    <button class="add-current-btn" id="add-current" title="Add current page to collection">+</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-title">Appearance</div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary);">Theme</label>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="theme-btn" data-theme="light" style="flex: 1; padding: 8px 12px;">Light</button>
        <button type="button" class="theme-btn" data-theme="dark" style="flex: 1; padding: 8px 12px;">Dark</button>
        <button type="button" class="theme-btn" data-theme="system" style="flex: 1; padding: 8px 12px;">System</button>
      </div>
    </div>

    <div class="settings-title">Reader Settings</div>

    <div style="margin-bottom: 12px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px;">
        <input type="checkbox" id="auto-fullscreen" style="width: 16px; height: 16px; cursor: pointer;">
        <span>Auto-enter fullscreen mode</span>
      </label>
    </div>

    <div style="margin-bottom: 12px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px;">
        <input type="checkbox" id="collection-newtab" style="width: 16px; height: 16px; cursor: pointer;">
        <span>Show collection on new tab</span>
      </label>
    </div>

    <div style="margin-bottom: 12px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px;">
        <input type="checkbox" id="collection-open-reader" style="width: 16px; height: 16px; cursor: pointer;">
        <span>Open collection items in reader mode</span>
      </label>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px;">
        <input type="checkbox" id="links-open-reader" style="width: 16px; height: 16px; cursor: pointer;">
        <span>Open links from reader in reader mode</span>
      </label>
    </div>

    <div class="settings-title" style="margin-top: 20px;">Export Collection</div>
    <div class="settings-description">
      Download your reading list as a .folio file
    </div>
    <button id="export-folio" class="btn-primary" style="width: 100%; margin-bottom: 20px;">📋 Export .folio</button>

    <div class="settings-title" style="margin-top: 20px;">Auto-Open Sites</div>
    <div class="settings-description">
      Articles from these sites will automatically open in reader view
    </div>
    <div class="domain-input-group">
      <input type="text" id="domain-input" placeholder="example.com" />
      <button id="add-domain">Add</button>
    </div>
    <div class="domain-list" id="domain-list"></div>
  </div>

  <div id="articles-list"></div>

  <div class="actions">
    <button id="export-pdf" class="btn-primary">📄 PDF</button>
    <button id="export-epub" class="btn-primary">📖 EPUB</button>
    <button id="clear-all" class="btn-danger">🗑 Clear</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
